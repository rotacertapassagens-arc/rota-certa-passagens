<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar master | Rota Certa Passagens</title><link rel="stylesheet" href="/assets/portal.css"><link rel="icon" href="/assets/logo.png"></head><body><main class="shell"><div class="top"><div class="brand">Rota Certa <span>Passagens</span></div><a href="/">Voltar ao site</a></div><section class="panel" style="max-width:560px;margin-inline:auto"><h1>Ativar acesso master</h1><p class="muted">Digite o e-mail convidado e o código de seis dígitos recebido. O código expira em 15 minutos e só pode ser usado uma vez.</p><form id="masterForm"><label>E-mail convidado<input id="masterEmail" type="email" maxlength="254" autocomplete="email" required></label><label>Código de ativação<input id="masterCode" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><label>Crie uma senha<input id="masterPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="masterPasswordHelp" required></label><p class="muted" id="masterPasswordHelp">Use pelo menos 12 caracteres, com letra maiúscula, letra minúscula e número.</p><label>Confirmar senha<input id="masterPasswordConfirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="submit">Ativar acesso master</button><p class="status" id="status" aria-live="polite"></p></form></section></main><script type="module" src="/assets/auth-pages.js"></script></body></html>
