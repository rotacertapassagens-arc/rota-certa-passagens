openapi: 3.1.0
info:
  title: Rota Certa Passagens - API do site público
  version: 0.1.0
  description: Contrato da API do site público e do painel administrativo.
servers:
  - url: http://localhost:3000
tags:
  - name: Public
  - name: Auth
  - name: Planner
  - name: Admin
  - name: Payments
  - name: Partners
  - name: Finance
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rc_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    cronToken:
      type: http
      scheme: bearer
      description: NOTIFICATIONS_CRON_TOKEN, for unattended scheduler calls with no session cookie.
    internalApiToken:
      type: http
      scheme: bearer
      description: ROTA_CERTA_SITE_API_TOKEN, segredo do Worker usado só pelo n8n (WHA-04). Nunca vai para o navegador.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Signup:
      type: object
      required: [name, email, password, termsAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        termsAccepted: { type: boolean, const: true }
    Trip:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        destination: { type: [string, "null"] }
    FlightQuote:
      type: object
      required: [type, name, email, phone, origem, destino, ida, adults, children, infants, tipo, cabinClass, baggage, flexibility, paymentPreference, contactConsent]
      properties:
        type: { type: string, const: quote }
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, description: "WhatsApp com código do país (+ ou 00). Guardado como +dígitos e só dígitos (customer_phone_digits). Sem código do país → 400 invalid_phone (Worker)." }
        origem: { type: string }
        destino: { type: string }
        ida: { type: string, format: date }
        volta: { type: string, format: date }
        adults: { type: integer, minimum: 1, maximum: 20 }
        children: { type: integer, minimum: 0, maximum: 20 }
        infants: { type: integer, minimum: 0, maximum: 20 }
        tipo: { type: string, enum: [Ida e volta, Somente ida] }
        cabinClass: { type: string }
        baggage: { type: string }
        flexibility: { type: string }
        paymentPreference: { type: string }
        observacoes: { type: string, maxLength: 3000 }
        contactConsent: { type: boolean, const: true }
        howHeard: { type: string, enum: [Instagram, "Indicação de um amigo", "Indicação de um parceiro/influenciador", Google, Outro] }
        referralCode: { type: string, maxLength: 64, description: "Código digitado manualmente; sempre revalidado no servidor e nunca prioritário sobre o link/cookie." }
        stopsPreference: { type: string, enum: ["Sem preferência", "Aceito escalas", "Somente voo direto"] }
        consentVersion: { type: string, description: "Versão do texto de consentimento que cita o WhatsApp (QUOTE_CONSENT_VERSION). Sem ela, o pedido é salvo mas o aceite do WhatsApp não é registrado." }
        submissionId: { type: string, format: uuid, description: "Gerado pela página, um por envio. Reenvio com os mesmos dados devolve o mesmo protocolo (200, replayed=true); mesmo id com dados diferentes → 409 submission_conflict." }
        source:
          type: object
          description: Origem da visita, toda opcional; valor fora do formato é descartado.
          properties:
            utm_source: { type: string, maxLength: 200 }
            utm_medium: { type: string, maxLength: 200 }
            utm_campaign: { type: string, maxLength: 200 }
            utm_content: { type: string, maxLength: 200 }
            utm_term: { type: string, maxLength: 200 }
            page: { type: string, maxLength: 300, description: "Caminho da página de entrada na aba." }
            referrer: { type: string, description: "Host do site externo de onde a visita veio." }
            capturedAt: { type: string, format: date-time }
    InternalProposal:
      type: object
      description: Contrato do WHA-04. Só campos mínimos; nada de e-mail, pagamento, observações, UTMs ou notas internas.
      required: [protocol, phone, name, contactName, collected, classificacao]
      properties:
        protocol: { type: string, pattern: "^RC-\\d{4}-\\d{5,}$" }
        phone: { type: string, description: "Só dígitos, com código do país." }
        name: { type: string }
        contactName: { type: string }
        collected:
          type: object
          properties:
            origem: { type: string, description: "Texto livre digitado no formulário (cidade ou aeroporto), não necessariamente código IATA." }
            destino: { type: string, description: "Texto livre digitado no formulário (cidade ou aeroporto), não necessariamente código IATA." }
            tipoViagem: { type: [string, "null"], enum: [ida_e_volta, so_ida, null] }
            dataIda: { type: [string, "null"], format: date }
            dataVolta: { type: [string, "null"], format: date }
            adultos: { type: integer }
            criancas: { type: integer }
            bebes: { type: integer }
            cabine: { type: [string, "null"], enum: [economica, premium_economica, executiva, primeira, null] }
            bagagem: { type: [string, "null"], enum: [item_pessoal, bagagem_de_mao, bagagem_despachada, null], description: "null quando o cliente escolheu 'Ainda não sei'." }
            aceitaEscalas: { type: [boolean, "null"], description: "null quando o cliente não tem preferência." }
            vooDireto: { type: [boolean, "null"], description: "null quando o cliente não tem preferência." }
            companhiaPreferida: { type: "null", description: "O formulário não coleta; sempre null." }
            maxEscalas: { type: "null", description: "O formulário não coleta; sempre null." }
            consentimento: { type: boolean, description: "true só quando o aceite do texto que cita o WhatsApp foi gravado neste pedido." }
        classificacao: { type: string, enum: [normal], description: "O site não classifica pedidos; sempre normal." }
    Partner:
      type: object
      required: [id, code, displayName, email, commissionType, currency, attributionWindowDays, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z0-9-]{3,32}$", description: "Slug único usado em /i/{code}." }
        displayName: { type: string }
        instagram: { type: [string, "null"] }
        whatsapp: { type: [string, "null"] }
        email: { type: string, format: email }
        commissionType: { type: string, enum: [fixed, percentage], description: "Campo legado do cadastro. O cálculo efetivo usa a regra global do programa." }
        commissionFixedCents: { type: [integer, "null"], description: "Campo legado; preservado para compatibilidade e histórico." }
        commissionPercentageBps: { type: [integer, "null"], description: "Campo legado; a regra global vigente é a autoridade para novas conversões." }
        currency: { type: string, minLength: 3, maxLength: 3 }
        attributionWindowDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
        active: { type: boolean }
        hasAccount: { type: boolean, description: "Se o convite já criou ou vinculou uma conta de usuário." }
        accountActivated: { type: boolean, description: "Se o parceiro já aceitou o convite e ativou o acesso ao painel." }
    PartnerCreate:
      type: object
      required: [code, displayName, email, commissionType, currency]
      properties:
        applicationId: { type: string, format: uuid, description: "Solicitação pública pendente que será aceita e vinculada atomicamente ao novo parceiro." }
        code: { type: string }
        displayName: { type: string }
        instagram: { type: string }
        whatsapp: { type: string }
        email: { type: string, format: email }
        commissionType: { type: string, enum: [fixed, percentage] }
        commissionFixedCents: { type: integer, minimum: 0 }
        commissionPercentageBps: { type: integer, minimum: 1, maximum: 10000 }
        currency: { type: string, default: EUR }
        attributionWindowDays: { type: integer, default: 30 }
    PartnerApplication:
      type: object
      required: [id, displayName, email, instagram, whatsapp, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        instagram: { type: string }
        whatsapp: { type: string }
        status: { type: string, enum: [pending, accepted, rejected] }
        partnerId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        privacyPolicyVersion: { type: string }
        privacyConsentAt: { type: string, format: date-time }
    PartnerProgramSettings:
      type: object
      required: [mode, flatBps, tier1MaxPassengers, tier1Bps, tier2MaxPassengers, tier2Bps, tier3MaxPassengers, tier3Bps, tier4Bps]
      properties:
        mode: { type: string, enum: [flat, progressive] }
        flatBps: { type: integer, minimum: 0, maximum: 10000 }
        tier1MaxPassengers: { type: integer, minimum: 1 }
        tier1Bps: { type: integer, minimum: 0, maximum: 10000 }
        tier2MaxPassengers: { type: integer, minimum: 2 }
        tier2Bps: { type: integer, minimum: 0, maximum: 10000 }
        tier3MaxPassengers: { type: integer, minimum: 3 }
        tier3Bps: { type: integer, minimum: 0, maximum: 10000 }
        tier4Bps: { type: integer, minimum: 0, maximum: 10000 }
    PartnerCommission:
      type: object
      required: [id, partnerId, amountCents, currency, status]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 0 }
        currency: { type: string }
        status: { type: string, enum: [pending, approved, paid, void] }
        voidReason: { type: [string, "null"] }
    PartnerLedgerEntry:
      type: object
      description: "Entrada do extrato do próprio parceiro. Nunca contém nome, e-mail, telefone ou qualquer PII do cliente."
      properties:
        protocolMasked: { type: string, example: "RC-20260910-A1••••" }
        route: { type: [string, "null"] }
        status: { type: string }
        referralSource: { type: string, enum: [link, manual, none] }
        requestedAt: { type: string, format: date-time }
        convertedAt: { type: [string, "null"], format: date-time }
        commission:
          type: [object, "null"]
          properties:
            amountCents: { type: integer }
            currency: { type: string }
            status: { type: string, enum: [pending, approved, paid, void] }
paths:
  /api/health:
    get:
      tags: [Public]
      summary: Verifica o processo HTTP
      responses:
        "200": { description: Disponível }
  /api/geo:
    get:
      tags: [Public]
      summary: Retorna país inferido dos cabeçalhos do proxy
      responses:
        "200": { description: País ou valor desconhecido }
  /api/lead:
    post:
      tags: [Public]
      summary: Salva uma proposta de voo, resolve atribuição de parceiro e envia confirmação
      description: >
        Atribuição é resolvida inteiramente no servidor: o cookie de referência assinado (definido
        por /i/{code}) tem prioridade; um código digitado manualmente em howHeard/referralCode só é
        usado quando não há cookie válido. O cliente nunca pode enviar um partnerId diretamente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlightQuote" }
      responses:
        "201": { description: "Pedido registrado. Worker: protocolo RC-AAAA-NNNNN, status received_awaiting_whatsapp, statusLabel e whatsappUrl (wa.me da Rota Certa com a mensagem pronta e o protocolo). A página nunca abre o WhatsApp sozinha." }
        "200": { description: "Reenvio do mesmo submissionId com os mesmos dados: mesmo protocolo, replayed=true, sem novo pedido nem novo e-mail." }
        "400": { description: Dados inválidos }
        "409": { description: "submission_conflict: o submissionId já foi usado com outros dados." }
        "429": { description: Limite excedido }
  /api/internal/proposals/{protocol}:
    get:
      tags: [Internal]
      summary: "WHA-04: consulta de servidor para servidor de um pedido por protocolo + telefone"
      description: >
        Só no Worker. Exige Authorization: Bearer com o segredo ROTA_CERTA_SITE_API_TOKEN (mínimo 32
        caracteres; sem o segredo configurado, toda chamada recebe 401). Comparação em tempo
        constante. O telefone é reduzido a dígitos e comparado com o número inteiro guardado; final
        igual ou número sem código do país não servem. Rate limit por IP: 120 chamadas por minuto, e
        10 credenciais erradas em 15 minutos bloqueiam aquele IP por 15 minutos. Só leitura.
      security: [{ internalApiToken: [] }]
      parameters:
        - { name: protocol, in: path, required: true, schema: { type: string, pattern: "^RC-\\d{4}-\\d{5,}$" } }
        - { name: phone, in: query, required: true, schema: { type: string }, description: "Número do WhatsApp; qualquer formatação vira só dígitos." }
      responses:
        "200":
          description: Pedido correto, só com os campos do contrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalProposal" }
        "401": { description: Sem credencial válida }
        "404": { description: "Protocolo + telefone não conferem (ou protocolo fora do formato RC-AAAA-NNNNN)" }
        "429": { description: Limite excedido }
  /i/{code}:
    get:
      tags: [Partners]
      summary: Link rastreável do parceiro; registra clique e redireciona ao formulário
      description: >
        Proteção anti-rajada: um clique repetido do mesmo par (IP, user-agent) anônimo para o
        mesmo código dentro de 60s não é contado de novo em referral_clicks (deduplicação via a
        mesma tabela rate_limit_buckets usada por todo o resto do app) — mas o cookie e o
        redirecionamento sempre acontecem, mesmo quando o clique não é contado. Nenhum IP puro é
        armazenado, apenas HMAC-SHA256 do IP/IP+user-agent. Retenção segue o ciclo de vida normal
        de referral_clicks/rate_limit_buckets (sem tabela de retenção longa dedicada nesta
        versão).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "302":
          description: >
            Código válido e ativo: redireciona para /proposta-voo.html?ref={code} e define o
            cookie rc_ref (HttpOnly, assinado, validade = janela de atribuição do parceiro).
            Código inexistente ou inativo: redireciona para "/" sem definir cookie nem registrar
            atribuição (o clique nunca é criado, mas a experiência do visitante não quebra).
  /api/partners/attribution:
    get:
      tags: [Partners]
      summary: Retorna apenas o nome público do parceiro atribuído (se houver) para o banner do formulário
      parameters:
        - { name: ref, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ active: boolean, code?, displayName? } — nunca expõe o partnerId interno" }
  /api/partner-applications:
    post:
      tags: [Partners]
      summary: Recebe uma solicitação pública de parceria para análise humana
      description: A solicitação fica pendente e não cria conta, parceiro, link nem comissão automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, instagram, whatsapp, privacyConsent, privacyPolicyVersion]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                instagram: { type: string, minLength: 2, maxLength: 120 }
                whatsapp: { type: string, minLength: 8, maxLength: 30 }
                privacyConsent: { type: boolean, const: true }
                privacyPolicyVersion: { type: string, const: "2026-09-24" }
                website: { type: string, description: Campo honeypot; deve permanecer vazio. }
      responses:
        "201": { description: Solicitação registrada }
        "202": { description: Honeypot aceito sem persistência }
        "409": { description: Já existe solicitação pendente para o e-mail }
        "429": { description: Limite excedido }
  /api/partner-program/settings:
    get:
      tags: [Partners]
      summary: Regra global vigente exibida publicamente aos parceiros
      responses:
        "200":
          description: Regra global de comissão
          content:
            application/json:
              schema:
                type: object
                properties: { settings: { $ref: "#/components/schemas/PartnerProgramSettings" } }
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Cria conta pendente e código de confirmação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Signup" }
      responses:
        "202": { description: Pedido aceito }
        "400": { description: Dados inválidos }
        "429": { description: Limite excedido }
  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirma e-mail, cria a viagem inicial Free e inicia a sessão
      responses:
        "200": { description: E-mail confirmado; cookies emitidos }
        "400": { description: Código inválido ou expirado }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica por e-mail e senha
      responses:
        "200": { description: Sessão criada }
        "401": { description: Credenciais inválidas }
  /api/auth/session:
    get:
      tags: [Auth]
      security: [{ sessionCookie: [] }]
      summary: Retorna a sessão e o direito de acesso
      responses:
        "200": { description: Sessão válida }
        "401": { description: Sem sessão válida }
  /api/auth/logout:
    post:
      tags: [Auth]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Revoga a sessão atual
      responses:
        "200": { description: Sessão revogada }
  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicita recuperação com resposta não enumerável
      responses:
        "202": { description: Resposta genérica }
  /api/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Consome token e revoga sessões existentes
      responses:
        "200": { description: Senha alterada }
        "400": { description: Token inválido ou expirado }
  /api/auth/change-password:
    post:
      tags: [Auth]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Altera senha autenticada e revoga outras sessões
      responses:
        "200": { description: Senha alterada }
  /api/planner:
    get:
      tags: [Planner]
      security: [{ sessionCookie: [] }]
      summary: Lê uma viagem, a lista de viagens e os limites do plano
      responses:
        "200": { description: Planner persistido }
        "402": { description: Teste gratuito encerrado; assinatura necessária }
        "404": { description: Viagem não encontrada }
  /api/planner/trips:
    post:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria viagem do cliente
      responses:
        "201": { description: Viagem criada }
        "403": { description: Limite de uma viagem ativa atingido no Free }
  /api/planner/trips/{tripId}/archive:
    post:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Arquiva uma viagem, limitado a duas no Free
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Viagem arquivada }
        "403": { description: Limite de duas viagens arquivadas atingido no Free }
  /api/planner/trips/{tripId}/restore:
    post:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Restaura uma viagem arquivada quando houver vaga ativa
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Viagem restaurada }
        "403": { description: Limite de uma viagem ativa atingido no Free }
  /api/planner/import-local:
    post:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Importa dados legados para uma viagem separada
      responses:
        "201": { description: Importação criada }
  /api/planner/{tripId}/{collection}:
    post:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria item de itinerary, places, expenses ou checklist
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: collection, in: path, required: true, schema: { type: string, enum: [itinerary, places, expenses, checklist] } }
      responses:
        "201": { description: Item criado }
        "404": { description: Viagem não pertence à sessão }
  /api/planner/{tripId}/budget:
    put:
      tags: [Planner]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza orçamento da viagem do cliente
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Orçamento atualizado }
  /api/admin/bootstrap/master-invites:
    post:
      tags: [Admin]
      summary: Cria convite do primeiro master com segredo de bootstrap
      responses:
        "201": { description: Convite criado }
        "404": { description: Bootstrap indisponível }
        "409": { description: Master já existe }
  /api/admin/master-invites/accept:
    post:
      tags: [Admin]
      summary: Consome convite master de uso único
      responses:
        "200": { description: Master ativado }
  /api/admin/overview:
    get:
      tags: [Admin]
      security: [{ sessionCookie: [] }]
      summary: Retorna métricas agregadas sem conteúdo privado do Planner
      responses:
        "200": { description: Resumo administrativo }
        "403": { description: Papel master necessário }
  /api/admin/leads:
    get:
      tags: [Admin]
      security: [{ sessionCookie: [] }]
      summary: Lista propostas de voo para usuários master, com origem/parceiro e comissão
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [new, reviewing, awaiting_customer, ready, sent, converted, lost, canceled, closed] } }
        - { name: partnerId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Propostas, dados de atendimento, parceiro de origem e comissão associada }
        "403": { description: Papel master necessário }
  /api/admin/leads/{id}:
    patch:
      tags: [Admin]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza status, notas, responsável e conversão (com criação idempotente de comissão)
      description: >
        Ao mudar status para "converted" com proposta atribuída a um parceiro percentual, exige
        saleAmountCents e saleCurrency (senão 422 sale_amount_required) e cria a comissão de forma
        transacional e idempotente: no máximo uma comissão *ativa* (não anulada) por proposta a
        qualquer momento, mas convert → void → reconvert cria uma nova comissão com novo snapshot,
        preservando o histórico das anteriores (nunca duplica linhas nas listagens). Repetir a
        chamada de conversão sem saleAmountCents/saleCurrency preserva o valor já gravado; tentar
        alterá-lo depois que a comissão já existe devolve 409 sale_amount_locked. saleCurrency deve
        ser igual à moeda configurada do parceiro (senão 409
        sale_currency_must_match_partner_currency) e um código ISO suportado pelo produto (senão
        422 invalid_currency). Mover uma proposta convertida para outro status enquanto existir
        comissão pending/approved exige voidCommissionReason (senão 409
        commission_void_reason_required); se a comissão já estiver paid, a transição é sempre
        bloqueada com 409 commission_paid_immutable, mesmo com motivo informado.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, reviewing, awaiting_customer, ready, sent, converted, lost, canceled, closed] }
                internalNotes: { type: string, maxLength: 3000 }
                assignToMe: { type: boolean }
                saleAmountCents: { type: integer, minimum: 0 }
                saleCurrency: { type: string, minLength: 3, maxLength: 3 }
                voidCommissionReason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200": { description: "Proposta atualizada; commissionPreview presente quando uma comissão foi criada/já existia" }
        "403": { description: Papel master necessário }
        "404": { description: Proposta não encontrada }
        "409": >
          description: commission_void_reason_required (comissão pending/approved exige motivo explícito para sair de "converted"),
          commission_paid_immutable (comissão já paga nunca pode sair de "converted"), sale_amount_locked
          (repetição tentando alterar valor/moeda já usados) ou sale_currency_must_match_partner_currency
        "422": { description: sale_amount_required (regra percentual sem valor de venda) ou invalid_currency (moeda fora do allowlist do produto) }
  /api/admin/partners:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Lista parceiros com estatísticas de cliques, propostas, conversões e comissão
      parameters:
        - { name: active, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200": { description: "{ partners: Partner[] }" }
        "403": { description: Papel master necessário }
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria um parceiro; novas conversões usam a regra global do programa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerCreate" }
      responses:
        "201": { description: Parceiro criado }
        "400": { description: Dados inválidos (código malformado ou tipo/valor de comissão inconsistente) }
        "409": { description: code_already_used, email_already_used_by_partner ou partner_application_not_pending }
        "422": { description: invalid_currency — código de moeda fora do allowlist do produto (EUR, USD, BRL, GBP) }
  /api/admin/partner-program/settings:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Lê a regra global de comissão no painel master
      responses:
        "200": { description: Regra vigente }
        "403": { description: Papel master necessário }
    patch:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Alterna entre percentual único e faixas progressivas por passageiros e edita todos os valores
      description: A mudança vale para próximas conversões de todos os parceiros; comissões existentes mantêm a fotografia da regra usada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerProgramSettings" }
      responses:
        "200": { description: Regra salva }
        "400": { description: Percentuais inválidos ou limites de faixas não crescentes }
        "403": { description: Papel master necessário }
  /api/admin/partner-applications:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Lista solicitações públicas de parceria, com pendentes primeiro
      responses:
        "200":
          description: Solicitações para revisão do master
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/PartnerApplication" }
        "403": { description: Papel master necessário }
  /api/admin/partner-applications/{id}/reject:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Recusa uma solicitação pendente, preservando o histórico
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Solicitação recusada }
        "409": { description: partner_application_not_pending }
  /api/admin/partners/{id}:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Detalhe do parceiro com extrato completo de comissões
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ partner: Partner, commissions: PartnerCommission[] }" }
        "404": { description: Parceiro não encontrado }
    patch:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Edita dados do parceiro, regra de comissão ou ativa/desativa (sem apagar histórico)
      description: >
        Desativar o parceiro (active=false) bloqueia o acesso ao próprio painel
        (/api/partner/summary, /api/partner/ledger) imediatamente, mesmo com a sessão ainda
        tecnicamente válida; reativar restaura o acesso. Alterar a moeda (currency) é bloqueado
        com 409 currency_locked_existing_commissions quando já existe qualquer comissão não
        anulada para o parceiro, para nunca reinterpretar valores históricos.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Parceiro atualizado }
        "404": { description: Parceiro não encontrado }
        "409": { description: currency_locked_existing_commissions }
        "422": { description: invalid_currency }
  /api/admin/partners/{id}/invite:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Prepara/vincula a conta de acesso do parceiro e envia código de ativação de uso único
      description: >
        Vincula partners.user_id e prepara o token de convite, mas NUNCA concede o papel
        "partner" nesta chamada — isso só acontece em /api/partner-invites/accept, depois do
        código de uso único ser validado. Reenviar o convite invalida qualquer token anterior
        ainda não usado.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Convite criado (ainda sem acesso concedido) }
        "404": { description: Parceiro não encontrado }
        "409": { description: partner_inactive ou email_linked_to_other_partner }
  /api/partner-invites/accept:
    post:
      tags: [Partners]
      summary: Ativa a conta do parceiro com e-mail + código de 6 dígitos + nova senha
      description: >
        Só aqui, transacionalmente e depois de validar o código de uso único, o papel "partner"
        é concedido. Um convite expirado, com código errado, ou nunca aceito nunca concede
        acesso — inclusive quando o e-mail já pertence a uma conta de cliente ativa.
      responses:
        "200": { description: Conta ativada; papel "partner" concedido nesta chamada }
        "400": { description: invalid_or_expired_invite }
        "409": { description: email_linked_to_other_partner }
        "429": { description: too_many_attempts }
  /api/partner/summary:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Painel do próprio parceiro autenticado — link, estatísticas e totais de comissão
      description: >
        Sempre filtrado pelo partners.user_id da sessão autenticada; nunca aceita um id de outro
        parceiro. Um parceiro desativado (active=false) recebe 403 imediatamente, mesmo com a
        sessão ainda válida para outros papéis da mesma conta.
      responses:
        "200": { description: Resumo do próprio parceiro }
        "403": { description: Conta sem papel partner vinculado, ou parceiro desativado }
  /api/partner/ledger:
    get:
      tags: [Partners]
      security: [{ sessionCookie: [] }]
      summary: Extrato cronológico das próprias indicações, sem qualquer PII do cliente
      responses:
        "200": { description: "{ entries: PartnerLedgerEntry[] }" }
        "403": { description: Conta sem papel partner vinculado }
  /api/admin/commissions/{id}/approve:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Aprova uma comissão pendente (auditado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Comissão aprovada }
        "409": { description: invalid_transition — só a partir de pending }
  /api/admin/commissions/{id}/pay:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Marca uma comissão aprovada como paga (auditado; dispara notificação idempotente)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Comissão paga }
        "409": { description: invalid_transition — só a partir de approved }
  /api/admin/commissions/{id}/void:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Anula uma comissão pending/approved com motivo obrigatório (auditado; preserva histórico)
      description: >
        Só pending/approved podem ser anuladas. Uma comissão paid nunca pode ser voidada por
        aqui — devolve 409 commission_paid_requires_adjustment; um fluxo de ajuste/estorno
        financeiro dedicado não faz parte desta versão.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        "200": { description: Comissão anulada }
        "404": { description: not_found }
        "409": { description: commission_paid_requires_adjustment ou already_void }
  /api/admin/notifications/process:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }, { cronToken: [] }]
      summary: Processa a fila (outbox) de notificações pendentes de forma idempotente
      description: >
        Aceita uma sessão master autenticada (painel) OU o cabeçalho `Authorization: Bearer
        <NOTIFICATIONS_CRON_TOKEN>` para um chamador automatizado sem cookie de sessão (ex.: um
        Cloudflare Scheduled Event), no mesmo padrão já usado pelo bootstrap do primeiro master.
        Em EMAIL_MODE=capture (padrão local/teste, em ambos os backends Node e Worker) apenas
        registra o evento em email_events, sem envio real. WhatsApp só é tentado quando
        WHATSAPP_NOTIFICATIONS_ENABLED=true; caso contrário o item é marcado "skipped". Nunca
        reverte proposta nem duplica comissão em caso de falha do provedor.

        Cada linha elegível é reclamada com uma lease curta (120s) antes de qualquer envio; a
        lease é renovada logo antes da chamada externa (e-mail/WhatsApp) e toda escrita
        condicionada ao lock_token confere quantas linhas foram de fato afetadas. Entrega é
        **"pelo menos uma vez, com deduplicação a cargo do provedor"** (via a idempotency_key da
        própria linha, propagada ao provedor de e-mail e ao webhook do WhatsApp) — nunca
        "exatamente uma vez": se a lease expirar durante um envio lento, outra chamada pode
        reclamar e reenviar a mesma linha antes que a primeira termine.
      responses:
        "200": { description: "{ processed, sent, skipped, failed, lockLost }. `lockLost` conta linhas cujo lock foi perdido para outro chamador antes desta chamada conseguir gravar o resultado final — nunca contadas em sent/skipped/failed por esta chamada." }
        "401": { description: Sem sessão válida e sem token cron }
        "403": { description: Sessão autenticada sem papel master }
  /api/admin/notifications/weekly-summary:
    post:
      tags: [Partners]
      security: [{ sessionCookie: [], csrfToken: [] }, { cronToken: [] }]
      summary: Gera (idempotente, por parceiro e por semana Europe/Lisbon) o resumo semanal agregado
      description: >
        Mesma autenticação dupla (sessão master ou NOTIFICATIONS_CRON_TOKEN) do endpoint de
        processamento acima. O payload gravado em notification_outbox segue o contrato
        camelCase compartilhado entre os backends Node e Worker (ver shared/notificationPayloads.ts):
        `{ weekStart, clicks, proposals, conversions, commissionCents, currency }`, sempre com a
        moeda própria do parceiro (nunca um padrão fixo) — nunca `commission_cents` (snake_case) e
        nunca uma moeda hardcoded.
      responses:
        "200": { description: "{ partnersConsidered, summariesCreated }" }
        "401": { description: Sem sessão válida e sem token cron }
        "403": { description: Sessão autenticada sem papel master }
  /api/admin/finance/cost-centers:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista centros de custo do módulo financeiro (Fase 1)
      responses:
        "200": { description: Lista de centros de custo }
        "401": { description: Sem sessão válida }
        "403": { description: Papel master necessário }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria um centro de custo
      responses:
        "201": { description: "{ id }" }
        "400": { description: Corpo inválido }
        "409": { description: Nome já usado por outro centro de custo }
  /api/admin/finance/cost-centers/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza nome ou ativa/desativa um centro de custo (nunca DELETE)
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
        "409": { description: Nome já usado por outro centro de custo }
  /api/admin/finance/categories:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista categorias financeiras hierárquicas (receita, custo direto, despesa operacional)
      responses:
        "200": { description: Lista de categorias }
        "401": { description: Sem sessão válida }
        "403": { description: Papel master necessário }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria categoria; categoria-filha deve ter o mesmo "kind" da categoria-pai
      responses:
        "201": { description: "{ id }" }
        "422": { description: Categoria-pai ou centro de custo padrão inexistente, ou kind incompatível com o pai }
  /api/admin/finance/categories/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza ou desativa uma categoria (bloqueado se houver categoria-filha ativa)
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
        "409": { description: Categoria tem subcategoria ativa; desative-as primeiro }
  /api/admin/finance/accounts:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista contas financeiras internas (banco/dinheiro/cartão/carteira) — sem integração bancária real
      responses:
        "200": { description: Lista de contas }
        "401": { description: Sem sessão válida }
        "403": { description: Papel master necessário }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria conta financeira interna
      responses:
        "201": { description: "{ id }" }
        "400": { description: Corpo inválido }
  /api/admin/finance/accounts/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza ou desativa uma conta financeira (nunca DELETE)
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
  /api/admin/finance/counterparties:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista contrapartes (fornecedor, companhia, consolidadora, fornecedor de milhas) — distinta de /api/admin/partners (parceiro de indicação)
      responses:
        "200": { description: Lista de contrapartes }
        "401": { description: Sem sessão válida }
        "403": { description: Papel master necessário }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria contraparte financeira
      responses:
        "201": { description: "{ id }" }
        "400": { description: Corpo inválido }
  /api/admin/finance/counterparties/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza ou desativa uma contraparte (nunca DELETE)
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
  /api/admin/finance/subscriptions:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista assinaturas recorrentes da empresa (Fase 2)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [trial, active, suspended, canceled, ended] } }
      responses:
        "200": { description: Lista de assinaturas }
        "401": { description: Sem sessão válida }
        "403": { description: Papel master necessário }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria assinatura; categoria precisa ser do tipo despesa operacional; grava o primeiro registro de histórico de preço
      responses:
        "201": { description: "{ id }" }
        "422": { description: Categoria/contraparte/conta/centro de custo inválido, ou categoria não é despesa operacional }
  /api/admin/finance/subscriptions/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza campos não financeiros da assinatura (descrição, conta, responsável etc.) — nunca o valor, que exige /reprice
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
  /api/admin/finance/subscriptions/{id}/reprice:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Reajusta o valor da assinatura preservando o valor anterior no histórico (nunca sobrescreve)
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Não encontrado }
        "409": { description: Assinatura cancelada ou encerrada (subscription_terminal) }
  /api/admin/finance/subscriptions/{id}/price-history:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Histórico completo de valores da assinatura, mais recente primeiro
      responses:
        "200": { description: Lista de reajustes }
  /api/admin/finance/subscriptions/{id}/status:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Muda o status da assinatura seguindo a máquina de estado (trial→active→suspended→canceled/ended)
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: Transição inválida (invalid_transition) }
  /api/admin/finance/subscriptions/generate-charges:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Gera (idempotente, por assinatura e por período) as obrigações de cobrança de toda assinatura ativa vencida, avançando next_charge_at período a período
      description: >
        Se a rotina não rodar por vários períodos, gera uma cobrança para cada período em atraso
        (até 36 iterações de segurança), cada uma com sua própria chave de idempotência
        (subscription_charge:{id}:{data}) — repetir a chamada nunca duplica uma cobrança já gerada.
      responses:
        "200": { description: "{ subscriptionsDue, created, skipped }" }
  /api/admin/finance/obligations:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista contas a pagar / despesas, com is_overdue calculado no servidor (status IN (open,partial) AND due_date < hoje) sem sobrescrever o status armazenado
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, partial, paid, canceled, reversed] } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [direct_cost, operating_expense] } }
        - { name: dueBefore, in: query, required: false, schema: { type: string, format: date } }
        - { name: counterpartyId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Lista de obrigações }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria obrigação manual (custo direto ou despesa operacional); categoria precisa ter o mesmo kind
      responses:
        "201": { description: "{ id }" }
        "422": { description: category_kind_mismatch ou vínculo inválido }
  /api/admin/finance/obligations/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza categoria/centro de custo/vencimento/conta/observações — bloqueado se a obrigação estiver cancelada ou estornada
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: obligation_terminal }
  /api/admin/finance/obligations/{id}/cancel:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cancela uma obrigação em aberto (sem nenhum pagamento) com motivo auditado — nunca DELETE
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: obligation_has_payments_or_terminal }
  /api/admin/finance/obligations/{id}/payments:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista os pagamentos (e estornos) de uma obrigação, em ordem cronológica
      responses:
        "200": { description: Lista de pagamentos }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Registra pagamento parcial ou total; recalcula o status da obrigação (open/partial/paid) no servidor
      responses:
        "201": { description: "{ id }" }
        "422": { description: payment_currency_must_match_obligation }
        "409": { description: obligation_not_payable }
  /api/admin/finance/obligation-payments/{id}/reverse:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Estorna um pagamento como um novo lançamento negativo vinculado (reversal_of) — nunca apaga o pagamento original; no máximo um estorno por pagamento
      responses:
        "201": { description: "{ id }" }
        "409": { description: payment_already_reversed ou cannot_reverse_a_reversal }
  /api/admin/finance/sales:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista vendas financeiras (Fase 3), com financialStatus derivado (no_receivables/open/partial/paid/canceled/refunded)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [confirmed, canceled, refunded] } }
        - { name: partnerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Lista de vendas }
  /api/admin/finance/sales/{id}:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Detalhe da venda, incluindo parcelas, emissões e lucro/margem calculados no servidor (Fase 4)
      responses:
        "200": { description: "{ sale, receivables, issuances, profit: { realizedDirectCostCents, projectedDirectCostCents, realizedGrossProfitCents, realizedMarginBps, projectedGrossProfitCents, projectedMarginBps } }" }
        "404": { description: Não encontrado }
  /api/admin/finance/sales/from-lead/{leadRequestId}:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria a venda financeira a partir de uma proposta já convertida (lead_requests.status=converted) — idempotente, nunca duplica, nunca recria a comissão do parceiro
      description: >
        A proposta precisa já estar convertida pelo fluxo existente da Central de Propostas
        (PATCH /api/admin/leads/{id}), com sale_amount_cents/sale_currency preenchidos. Chamar de
        novo para a mesma proposta devolve a venda já existente (200, alreadyExisted:true) em vez
        de criar uma segunda ou retornar erro.
      responses:
        "201": { description: "{ id, alreadyExisted: false }" }
        "200": { description: "{ id, alreadyExisted: true } — venda já existia" }
        "409": { description: lead_not_converted }
        "422": { description: sale_amount_missing, lead_protocol_missing ou discount_exceeds_gross_amount }
  /api/admin/finance/sales/{id}/cancel:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cancela uma venda confirmada sem nenhum recebimento — nunca DELETE
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: sale_has_payments_use_refund (use /refund) ou sale_not_cancelable }
  /api/admin/finance/sales/{id}/refund:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Marca a venda como reembolsada — exige que já exista ao menos um recebimento líquido positivo
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: sale_has_no_payments_use_cancel (use /cancel) ou sale_not_refundable }
  /api/admin/finance/sales/{id}/receivables:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista as parcelas de uma venda
      responses:
        "200": { description: Lista de parcelas }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria uma ou mais parcelas para a venda; a soma de todas as parcelas ativas nunca pode ultrapassar o valor líquido da venda
      responses:
        "201": { description: "{ ids }" }
        "409": { description: installments_exceed_sale_amount ou sale_not_confirmed }
  /api/admin/finance/receivables/{id}/payments:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista os recebimentos (e estornos) de uma parcela
      responses:
        "200": { description: Lista de recebimentos }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Registra recebimento parcial ou total; recalcula o status da parcela (open/partial/paid) no servidor
      responses:
        "201": { description: "{ id }" }
        "422": { description: payment_currency_must_match_receivable }
        "409": { description: receivable_not_payable }
  /api/admin/finance/receivable-payments/{id}/reverse:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Estorna um recebimento como um novo lançamento negativo vinculado (reversal_of) — nunca apaga o original; no máximo um estorno por recebimento
      responses:
        "201": { description: "{ id }" }
        "409": { description: payment_already_reversed ou cannot_reverse_a_reversal }
  /api/admin/finance/sales/{saleId}/issuances:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista as emissões de uma venda (Fase 4)
      responses:
        "200": { description: Lista de emissões }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria uma emissão para a venda; a moeda precisa ser igual à moeda da venda
      responses:
        "201": { description: "{ id }" }
        "422": { description: issuance_currency_must_match_sale }
        "409": { description: sale_not_confirmed }
  /api/admin/finance/issuances/{id}:
    patch:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza uma emissão ainda pendente — bloqueado depois de emitida (custo histórico nunca é alterado retroativamente)
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: issuance_locked_after_issued }
  /api/admin/finance/issuances/{id}/issue:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Marca a emissão como emitida — exige PNR já preenchido; a partir daqui os campos de custo ficam travados
      responses:
        "200": { description: "{ ok: true }" }
        "422": { description: pnr_required_to_issue }
        "409": { description: invalid_transition }
  /api/admin/finance/issuances/{id}/cancel:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cancela uma emissão ainda pendente (nunca emitida) — nunca DELETE
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: invalid_transition (só permitido a partir de "pending") }
  /api/admin/finance/issuances/{id}/refund:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Reembolsa uma emissão já emitida
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: invalid_transition (só permitido a partir de "issued") }
  /api/admin/finance/mileage-lots:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista lotes de milhas (Fase 5), com balanceQuantity e isExpired calculados no servidor
      parameters:
        - { name: counterpartyId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: program, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, depleted, expired, canceled] } }
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Lista de lotes }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Compra um lote de milhas; cria automaticamente, na mesma transação, a obrigação de pagamento ao fornecedor (custo direto)
      responses:
        "201": { description: "{ id, obligationId }" }
        "422": { description: category_must_be_direct_cost ou vínculo inválido }
  /api/admin/finance/mileage-lots/{id}:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Detalhe do lote, incluindo todas as alocações (ativas e estornadas)
      responses:
        "200": { description: "{ mileageLot, allocations }" }
        "404": { description: Não encontrado }
  /api/admin/finance/mileage-lots/{id}/cancel:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cancela um lote sem nenhuma alocação ativa — nunca DELETE; lote com alocação nunca pode ser apagado nem escondido
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: mileage_lot_has_active_allocations }
  /api/admin/finance/issuances/{issuanceId}/mileage-allocations:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Lista as alocações de milhas de uma emissão (pode ter mais de um lote, emissão híbrida)
      responses:
        "200": { description: Lista de alocações }
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Aloca milhas de um lote para a emissão; nunca permite saldo negativo mesmo sob concorrência (SELECT ... FOR UPDATE no lote); recalcula miles_quantity/miles_cost_cents da emissão
      description: >
        Só permitido enquanto a emissão está `pending` (mesma trava de custo histórico da Fase 4).
        O custo da alocação é calculado com BigInt a partir de total_cost_cents/quantity_purchased
        do lote (shared/mileageCost.ts) — nunca float, nunca reprecificado depois. Prova de
        concorrência real (duas transações Postgres genuínas disputando a última unidade) em
        tests/mileage-allocation-concurrency.pg-real.test.ts, gated e não executada por `pnpm test`.
      responses:
        "201": { description: "{ id }" }
        "409": { description: insufficient_mileage_balance, mileage_lot_not_active, mileage_lot_expired ou issuance_locked_after_issued }
        "422": { description: issuance_mode_does_not_use_miles ou mileage_lot_currency_must_match_issuance }
  /api/admin/finance/mileage-allocations/{id}/void:
    post:
      tags: [Finance]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Estorna uma alocação (devolve o saldo ao lote, reabre o lote se estava esgotado) — nunca apaga a alocação original; no máximo um estorno por alocação
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: allocation_already_voided ou issuance_locked_after_issued }
  /api/admin/finance/dashboard/overview:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Indicadores financeiros consolidados por moeda (Fase 6) — faturamento, custo direto, lucro bruto, margem, despesas operacionais e resultado operacional (competência) ou recebido/pago/saldo (caixa)
      description: >
        Todo indicador é calculado no servidor a partir de linhas persistidas, nunca aceito pronto
        do cliente, e sempre rotulado pelo regime escolhido (docs/financeiro/REGRAS_CALCULO.md).
        `regime=accrual` (padrão) usa sale_date/competency_date; `regime=cash` usa as datas de
        liquidação real (received_at/paid_at).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: regime, in: query, required: false, schema: { type: string, enum: [accrual, cash], default: accrual } }
      responses:
        "200": { description: "{ regime, from, to, indicators: [{ currency, ... }] }" }
        "400": { description: invalid_date_range (from > to) }
  /api/admin/finance/dashboard/alerts:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Contas vencidas, próximos vencimentos (7/30 dias), assinaturas próximas da cobrança, vendas com margem baixa/negativa, lotes de milhas com saldo baixo ou vencendo em breve
      parameters:
        - { name: minMarginBps, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: lowBalanceThreshold, in: query, required: false, schema: { type: integer, default: 1000 } }
        - { name: expiringDays, in: query, required: false, schema: { type: integer, default: 30 } }
      responses:
        "200": { description: "{ overdueObligations, overdueReceivables, upcomingObligations7d, upcomingObligations30d, subscriptionsDueSoon, salesBelowMarginThreshold, mileageLotsLowBalance, mileageLotsExpiringSoon }" }
  /api/admin/finance/dashboard/expenses-by-category:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Despesas agrupadas por categoria e moeda, em competência ou caixa
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: regime, in: query, required: false, schema: { type: string, enum: [accrual, cash], default: accrual } }
      responses:
        "200": { description: "{ regime, from, to, categories: [{ categoryId, categoryName, kind, currency, amountCents }] }" }
  /api/admin/finance/dashboard/export.csv:
    get:
      tags: [Finance]
      security: [{ sessionCookie: [] }]
      summary: Exportação CSV UTF-8 (com BOM) de vendas, contas a pagar ou contas a receber, protegida contra CSV injection
      description: >
        Toda célula é escapada por shared/financeCsv.ts: uma célula começando com =, +, -, @, tab
        ou CR recebe um apóstrofo à frente (mitigação padrão OWASP para "CSV injection" via
        Excel/Sheets), e vírgula/aspas/quebra de linha são escapadas conforme RFC 4180. Limitado a
        5000 linhas por exportação.
      parameters:
        - { name: report, in: query, required: true, schema: { type: string, enum: [sales, obligations, receivables] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Arquivo CSV (text/csv; charset=utf-8) }
  /api/payments/checkout:
    post:
      tags: [Payments]
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria checkout somente no Stripe sandbox
      responses:
        "200": { description: URL do checkout sandbox }
        "503": { description: Sandbox não configurado }
  /api/payments/stripe-webhook:
    post:
      tags: [Payments]
      summary: Processa webhook sandbox assinado e idempotente
      responses:
        "200": { description: Evento aceito ou já processado }
        "400": { description: Assinatura inválida }
